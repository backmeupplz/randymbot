name: CI
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # Our own PRs and pushes run on the Mac runners; outsiders' PRs (AGit via the github bot) and bots like radiant run
    # on Linux in the node:22 image (label `docker`): it ships production's Node major, so there's no setup-node download
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude","radiant"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'docker' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Production's Node major (.nvmrc); the Mac runners keep their tool cache, so this is a cache hit there
      - if: runner.os == 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # bun reads yarn.lock (the same versions production's yarn install gets) and installs in seconds, cold or warm.
      # The Dockerfile keeps yarn
      - run: bun install --frozen-lockfile
      - run: node_modules/.bin/tsc --skipLibCheck
      - run: node --test 'test/*.test.js'
